[build-system]
# PEP 639 license expression (`license = "MIT"`) needs setuptools 77.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virasoro_blocks"
version = "0.1.0"
description = "High-precision 2d Virasoro, global, N=1 superconformal and torus conformal blocks as derivative tables, and SDPB bootstrap problems built from them"
readme = "README.md"
license = "MIT"
authors = [{name = "David Poland", email = "david.poland@yale.edu"}]
requires-python = ">=3.10"
keywords = ["conformal bootstrap", "Virasoro blocks", "conformal field theory", "SDPB"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
# virasoro_blocks and virasoro_bootstrap need only these.  SDPB is an external
# program (Docker, Apptainer or a native build), not a Python dependency.
dependencies = [
    # mpmath 1.4 changed precision handling that the recursion relies on (86 test failures in a
    # clean install, 2026-10-26); lift the cap once the suite passes on it
    "mpmath>=1.3,<1.4",
    "numpy>=1.26",
    "python-flint>=0.7",
    "tomli>=2; python_version < '3.11'",
]


[project.urls]
Homepage = "https://github.com/davidpoland/virasoro_blocks"
Repository = "https://github.com/davidpoland/virasoro_blocks"
Issues = "https://github.com/davidpoland/virasoro_blocks/issues"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist>=3.2"]
plot = ["matplotlib>=3.8"]
dev = [
    "pytest>=7",
    "pytest-xdist>=3.2",
    "matplotlib>=3.8",
]

[project.scripts]
virasoro_blocks = "virasoro_blocks.__main__:main"
vb-submit = "virasoro_bootstrap.hpc.submit:main"
vb-status = "virasoro_bootstrap.hpc.collect:status_main"
vb-collect = "virasoro_bootstrap.hpc.collect:collect_main"
vb-list = "virasoro_bootstrap.hpc.collect:list_main"
vb-certify = "virasoro_bootstrap.hpc.recertify:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["virasoro_blocks*", "virasoro_bootstrap*"]

[tool.setuptools]
package-dir = {"" = "src"}

# default_params.json is library configuration, not a research input: both its
# readers are library modules, and resolving it against the checkout made
# virasoro_bootstrap unimportable from an installed wheel.
[tool.setuptools.package-data]
virasoro_bootstrap = ["default_params.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The suite is mpmath-bound (high-precision recursion); tests are independent
# -- per-process mp.dps, per-test TemporaryDirectory -- so run them in parallel.  worksteal
# lets idle workers take queued tests, so a long test at the end does not strand a batch.
addopts = "-n auto --dist worksteal"
markers = [
    "blocks: reusable virasoro_blocks engine, block tables, and CLI tests",
    "bootstrap: crossing, positivity, moments, and bootstrap problem tests",
    "slow: high-precision or end-to-end numerical checks (opt-in: --slow)",
    "integration: HPC or other application-boundary checks",
]
